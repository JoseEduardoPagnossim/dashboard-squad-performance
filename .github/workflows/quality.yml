name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Validar projeto, auditoria e regras financeiras
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Preparar ambiente
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validar estrutura, segurança e JavaScript
        run: npm run validate

      - name: Executar testes automatizados
        run: npm test
